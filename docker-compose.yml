services:
  api:
    build: .
    container_name: extractor_api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=extractor
      - DB_PASSWORD=extractorpass
      - DB_NAME=extractor_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  frontend:
    build: .
    container_name: extractor_frontend
    command: streamlit run src/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - .:/app

  db:
    image: ankane/pgvector:v0.5.0
    container_name: extractor_db
    environment:
      POSTGRES_USER: extractor
      POSTGRES_PASSWORD: extractorpass
      POSTGRES_DB: extractor_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractor -d extractor_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
